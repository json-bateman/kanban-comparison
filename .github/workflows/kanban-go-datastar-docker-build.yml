name: kanban-go-datastar - Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "kanban-go-datastar/**"
      - ".github/workflows/kanban-go-datastar-docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kanban-go-datastar
          file: ./kanban-go-datastar/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kanban:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kanban:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
